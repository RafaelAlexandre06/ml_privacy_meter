run: # Full level-3 (strong) U-RMIA run — cluster-scale
  random_seed: 12345
  log_dir: demo_urmia_online # Reuse to resume; change for a fresh experiment
  time_log: True

audit:
  privacy_game: privacy_loss_model
  algorithm: RMIA
  num_ref_models: 16 # Train-then-unlearn references; K>=8 for stable U-LiRA Gaussians
  offline_a: 0.3 # Used by the naive (offline) arm and the population p(z) term
  device: cuda:0
  report_log: report_urmia_online
  batch_size: 20000 # Signal-inference batch (pure forward passes)
  population_size: 10000
  # Adds the modified-entropy statistic (conf_global / mentr_global / ulira_mentr
  # columns). One extra inference pass over the audit subset, no extra training.
  entropy_signal: True

train:
  model_name: wrn28-1
  device: cuda:0
  batch_size: 256
  optimizer: SGD
  learning_rate: 0.1
  weight_decay: 0.0005
  epochs: 100

unlearn:
  algorithm: neggrad_plus
  forget_size: 500
  params: # Best-known tuning from the PC 100-epoch sweep; kept identical to the
    # lv2 config (cifar10_neggrad_plus.yaml) so lv2-vs-lv3 isolates the ATTACK.
    # The previous block here (epochs 5, lr 0.01, no cap) reproduced the recipe
    # that diverged on the PC before the ascent cap existed.
    epochs: 2
    learning_rate: 0.002
    forget_coef: 0.5
    retain_coef: 1.0
    forget_loss_cap: 1.16 # ~ retrained forget_loss at 100ep (measured 1.1577)

data:
  dataset: cifar10
  data_dir: data
