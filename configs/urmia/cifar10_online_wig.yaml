run: # Level-3 U-RMIA with the WIG unlearner (Lee et al., PoPETs 2026) — cluster-scale
  random_seed: 12345
  # MUST differ from the first WIG run (demo_urmia_online_wig): level-3 references
  # are train-then-unlearn, so they are invalid once unlearn.params change.
  # Pointing at the old dir is now a hard error rather than a silent reuse
  # (unlearner_registry.check_cached_unlearn), but a fresh dir is still the right
  # move — it keeps both runs. Old dir kept for the record.
  log_dir: demo_urmia_online_wig_ft30
  time_log: True

audit:
  privacy_game: privacy_loss_model
  algorithm: RMIA
  num_ref_models: 16 # Train-then-unlearn references; K>=8 for stable U-LiRA Gaussians
  offline_a: 0.3 # Used by the naive (offline) arm and the population p(z) term
  device: cuda:0
  report_log: report_urmia_online
  batch_size: 20000 # Signal-inference batch (pure forward passes; fits easily in 100GB)
  population_size: 10000
  # Adds the modified-entropy statistic (conf_global / mentr_global / ulira_mentr
  # columns). Essential here: WIG's claim is uniformly small gaps across BOTH
  # statistics, vs biased unlearners that defend one and leak through the other.
  entropy_signal: True

train:
  model_name: wrn28-1
  device: cuda:0
  batch_size: 256 # Kept identical to cifar10_online.yaml so runs stay comparable
  optimizer: SGD
  learning_rate: 0.1
  weight_decay: 0.0005
  epochs: 100

unlearn:
  algorithm: wig # Structural: OVL-selected weight re-init + retain fine-tuning
  forget_size: 500
  params:
    init_ratio: 0.3 # Fraction of Conv/Linear weights re-initialized per layer (paper: 0.3-0.4 best)
    grad_batch_size: 32 # Forget-gradient batch size for the Gaussian fit (paper Sec. 5.1)
    # Retain fine-tuning budget. The first run used 5 epochs @ lr 0.01 and every
    # model came out mid-recovery: retain acc 0.5602, unseen 0.5040, fine-tune loss
    # stalled at 1.20 (target) / 1.36 (refs) vs ~0.02 for the original training.
    # That is ~480 optimizer steps at 1/10 the LR to repair 30% of the weights,
    # against the ~9,600 steps that built the model — roughly 5% of the budget.
    # 30 epochs @ 0.02 is ~2,900 ref steps (~30% of original), ~12 min extra across
    # all 17 models. The paper's Fig. 7 "gap stable after ~2 epochs" is about the
    # privacy gap settling, NOT about utility recovering — do not tune off it.
    epochs: 30
    learning_rate: 0.02

data:
  dataset: cifar10
  data_dir: data
