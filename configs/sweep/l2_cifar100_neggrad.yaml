run: # Level-2 (naive offline U-RMIA) - neggrad on cifar100, H100 cluster scale.
  # One of the 10 level-2 legs in sweep_l2.sh. Every leg shares random_seed,
  # model, training recipe and forget_size, so a difference between two legs is
  # the unlearner or the attack level and nothing else.
  random_seed: 12345 # Same seed => same F/R/U split in every leg
  log_dir: sweep_l2_cifar100_neggrad
  time_log: True

audit:
  privacy_game: privacy_loss_model
  algorithm: RMIA
  num_ref_models: 16 # Same K in l2 and l3, so "fewer refs" cannot explain a gap
  offline_a: 0.3
  device: cuda:0
  report_log: report_urmia
  batch_size: 20000 # Signal inference only (forward passes); fits an H100 easily
  population_size: 10000
  # Retain-set leakage (Hayes et al. 2024): sample this many retain points
  # and measure whether unlearning F left them more exposed to a standard
  # MIA. Reuses the trained models + references; one extra signal pass only.
  retain_audit_size: 1000

train:
  model_name: wrn28-1
  device: cuda:0
  # Kept at 256, NOT raised for the H100: the fixed LR schedule was designed
  # around this batch size, and the existing PC results stop being comparable
  # if it changes. The H100 win here is wall-clock per model, not batch size.
  batch_size: 256
  optimizer: SGD
  learning_rate: 0.1
  weight_decay: 0.0005
  epochs: 100

unlearn:
  algorithm: neggrad
  forget_size: 500
  params:
  # Pure gradient ascent on the forget set, no retain rehearsal and no cap, so
  # it is the most destructive of the targeted methods and diverges quickly.
  # 500 forget points at train batch 256 is 2 steps per epoch, so 3 epochs is
  # ~6 ascent steps -- deliberately few. If 'unlearned' test_acc collapses,
  # lower learning_rate before lowering epochs; if forget_acc does not move,
  # raise epochs.
    epochs: 3
    learning_rate: 0.001

data:
  dataset: cifar100
  data_dir: data
